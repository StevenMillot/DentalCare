name: Audit SEO hebdomadaire

on:
  schedule:
    # Tous les lundis à 8h00 UTC (9h/10h heure de Paris selon la saison).
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: seo-audit
  cancel-in-progress: false

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SEO audit
        id: audit
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GA4_PROPERTY_ID: '546646264'
          GSC_SITE_URL: 'https://paro-spe.fr/'
        run: node scripts/seo-audit.mjs

      - name: Commit report
        run: |
          git config user.name "seo-audit-bot"
          git config user.email "actions@github.com"
          git add seo-reports/
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "Rapport SEO hebdomadaire ${{ steps.audit.outputs.report_path }}"
            git push
          fi

      - name: Create summary issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "seo-audit" --color "0E8A16" \
            --description "Rapports d'audit SEO hebdomadaires" --force
          {
            echo "${{ steps.audit.outputs.report_body }}"
            echo ""
            echo "_Ce rapport a aussi été committé dans le dépôt : \`${{ steps.audit.outputs.report_path }}\`._"
          } > /tmp/seo-issue-body.md
          gh issue create \
            --title "${{ steps.audit.outputs.issue_title }}" \
            --label "seo-audit" \
            --body-file /tmp/seo-issue-body.md
